# Stress: the largest participant is offline for 30 minutes at 10:00. Its incoming and
# outgoing payments are retried in one burst when it comes back (ASSUMPTION: none dropped).
[experiment]
name = "stress"
description = "Largest participant offline for 30 minutes"

[scenario]
seed = 20260930
participants = 200
days = 1
payments_per_day = 1_000_000
calibration = "data/calibration/pix.toml"

[stress]
participant = 0
start_ms = 36_000_000
duration_ms = 1_800_000
engines = ["gross", "micro:all:1000:10000", "micro:shortfall:1000:10000", "deferred:10"]
# constrained run: everybody opens with its own baseline UB (no slack)
constrained_fraction_of_ub = 1.0
