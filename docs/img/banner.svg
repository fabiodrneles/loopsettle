<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b2b"/>
      <stop offset="1" stop-color="#12324a"/>
    </linearGradient>
    <marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="aD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200"/>
    <path d="M100 0 V360 M200 0 V360 M300 0 V360 M400 0 V360 M500 0 V360 M600 0 V360 M700 0 V360 M800 0 V360 M900 0 V360 M1000 0 V360 M1100 0 V360"/>
  </g>

  <text x="80" y="150" fill="#ffffff" font-size="68" font-weight="700" letter-spacing="-1">LoopSettle</text>
  <text x="82" y="196" fill="#cbd5e1" font-size="24">Circular liquidity in instant payment systems</text>
  <text x="82" y="232" fill="#94a3b8" font-size="18">Open simulator · Hodge · CDFD · atomic micro-cycles · calibrated to Pix public data</text>
  <g font-size="15" fill="#e2e8f0">
    <rect x="82" y="262" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="141" y="283" text-anchor="middle">Rust + WASM</text>
    <rect x="212" y="262" width="138" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="281" y="283" text-anchor="middle">Reproducible</text>
    <rect x="362" y="262" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="421" y="283" text-anchor="middle">Apache-2.0</text>
  </g>

  <!-- cycle diagram: A -> B -> C -> A (circular, netted) plus directional flow -->
  <g>
    <path d="M905 92 Q975 130 1012 205" fill="none" stroke="#2dd4bf" stroke-width="4" marker-end="url(#aC)"/>
    <path d="M990 252 Q905 280 835 252" fill="none" stroke="#2dd4bf" stroke-width="4" marker-end="url(#aC)"/>
    <path d="M808 205 Q840 130 870 96" fill="none" stroke="#2dd4bf" stroke-width="4" marker-end="url(#aC)"/>
    <path d="M1046 252 L1108 288" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#aD)"/>
    <circle cx="887" cy="78" r="30" fill="#0f2a40" stroke="#e2e8f0" stroke-width="2.5"/>
    <circle cx="1025" cy="230" r="30" fill="#0f2a40" stroke="#e2e8f0" stroke-width="2.5"/>
    <circle cx="815" cy="232" r="30" fill="#0f2a40" stroke="#e2e8f0" stroke-width="2.5"/>
    <g fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">
      <text x="887" y="86">A</text><text x="1025" y="238">B</text><text x="815" y="240">C</text>
    </g>
    <g font-size="14">
      <rect x="760" y="312" width="14" height="4" fill="#2dd4bf"/>
      <text x="780" y="318" fill="#cbd5e1">circular (nettable)</text>
      <rect x="930" y="312" width="14" height="4" fill="#f59e0b"/>
      <text x="950" y="318" fill="#cbd5e1">directional (needs liquidity)</text>
    </g>
  </g>
</svg>
